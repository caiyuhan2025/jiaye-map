<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>加页手记地图小抄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局 ===== */
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-card: #2a2a2a;
            --text-primary: #e8e4dc;
            --text-secondary: #9a9590;
            --accent: #d4a574;
            --accent-dark: #b8956a;
            --border: #3a3a3a;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            display: none;
            min-height: 100vh;
            padding: 20px 20px 40px;
            animation: fadeIn 0.3s ease;
            position: relative;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 头部（首页） ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0 30px;
            position: relative;
            flex-wrap: wrap;
        }
        .header h1 {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 1.8rem;
            color: var(--text-primary);
            letter-spacing: 0.15em;
        }

        /* ===== 通用右上角署名（首页 & 分页） ===== */
        .header-credits {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            text-align: right;
            font-size: 0.7rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .header-credits .credit-line {
            display: block;
        }

        /* ===== 返回按钮 ===== */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
        }
        .back-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ===== 网格 / Flex 通用 ===== */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 0 10px;
        }
        .grid-auto {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 0 40px;
        }

        /* ----- 首页封面 Flex 容器（自动居中、放大） ----- */
        .cover-flex {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 0 10px;
        }
        .cover-flex .card {
            flex: 0 0 280px;
            width: 280px;
        }

        .footer-credits {
            text-align: right;
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 30px;
            padding-right: 20px;
        }

        /* ===== 卡片 ===== */
        .card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px var(--shadow);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px var(--shadow);
            border-color: var(--accent);
        }
        .card:active {
            transform: translateY(-2px);
        }

        /* ===== 封面容器：竖版 宽:高 = 5:6 ===== */
        .card-image-wrap {
            width: 100%;
            aspect-ratio: 5 / 6;
            overflow: hidden;
            background: var(--bg-secondary);
            position: relative;
        }
        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }
        .card:hover .card-image-wrap img {
            transform: scale(1.05);
        }

        .card-label {
            padding: 12px 8px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }
        .card-label .badge {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        /* ===== 地图卡片 (横图) ===== */
        .map-card {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid var(--border);
            box-shadow: 0 2px 12px var(--shadow);
        }
        .map-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px var(--shadow);
            border-color: var(--accent);
        }
        .map-card:active {
            transform: translateY(-3px);
        }

        .map-image-wrap {
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        .map-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .map-card:hover .map-image-wrap img {
            transform: scale(1.03);
        }

        .map-label {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }
        .map-label span {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .map-label .expand-icon {
            color: var(--accent);
        }

        /* ===== 详情页头部（含右上角署名） ===== */
        .detail-header {
            text-align: center;
            padding: 20px 0 10px;
            position: relative;  /* 让 .header-credits 相对定位 */
        }
        .detail-header h2 {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 1.5rem;
            color: var(--text-primary);
            letter-spacing: 0.1em;
        }
        .detail-header .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .detail-header .breadcrumb {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .detail-header .breadcrumb span {
            color: var(--accent);
        }

        /* ===== 查看器 ===== */
        .viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            animation: viewerIn 0.2s ease;
        }
        .viewer.active {
            display: flex;
        }
        @keyframes viewerIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .viewer img {
            max-width: 92%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            user-select: none;
        }

        .viewer .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .viewer .close-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        .viewer .viewer-back {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .viewer .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 12px var(--shadow);
            opacity: 0.8;
        }
        .viewer .nav-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
            opacity: 1;
        }
        .viewer .nav-btn.left {
            left: 24px;
        }
        .viewer .nav-btn.right {
            right: 24px;
        }
        .viewer .nav-btn svg {
            width: 24px;
            height: 24px;
        }

        .viewer .page-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            letter-spacing: 0.5px;
        }

        /* ===== 提示弹窗（教程） ===== */
        .tip-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(4px);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: viewerIn 0.2s ease;
        }
        .tip-modal.active {
            display: flex;
        }

        .tip-box {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 12px;
            width: 100%;
            max-width: 520px;
            padding: 30px 26px 24px;
            box-shadow: 0 20px 50px var(--shadow);
            animation: tipIn 0.28s ease;
        }
        @keyframes tipIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .tip-box h3 {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 0.08em;
            margin-bottom: 18px;
            padding-right: 30px;
        }

        .tip-step {
            display: flex;
            gap: 10px;
            font-size: 0.88rem;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 14px;
        }
        .tip-step:last-of-type {
            margin-bottom: 4px;
        }
        .tip-step .num {
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            margin-top: 4px;
            border-radius: 50%;
            background: var(--accent);
            color: #1a1a1a;
            font-size: 0.72rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tip-step .hl {
            color: var(--accent);
            font-weight: 700;
        }

        .tip-ok {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #1a1a1a;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .tip-ok:hover {
            background: var(--accent-dark);
        }
        .tip-ok:active {
            transform: scale(0.98);
        }

        .tip-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .tip-close:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }
        .tip-close svg {
            width: 16px;
            height: 16px;
        }

        /* ===== 纹理 ===== */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .cover-flex .card {
                flex: 0 0 220px;
                width: 220px;
            }
            .grid-4 {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
            .header-credits {
                position: static;
                transform: none;
                text-align: center;
                margin-top: 6px;
                font-size: 0.6rem;
            }
            .header {
                flex-direction: column;
                padding-bottom: 10px;
            }
            .detail-header .header-credits {
                position: static;
                transform: none;
                text-align: center;
                margin-top: 8px;
            }
        }

        @media (max-width: 640px) {
            .cover-flex .card {
                flex: 0 0 160px;
                width: 160px;
            }
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .viewer .nav-btn {
                width: 40px;
                height: 40px;
            }
            .viewer .nav-btn.left {
                left: 12px;
            }
            .viewer .nav-btn.right {
                right: 12px;
            }
            .viewer .page-indicator {
                bottom: 20px;
                font-size: 0.75rem;
                padding: 4px 14px;
            }
            .tip-box {
                padding: 26px 18px 18px;
            }
            .tip-step {
                font-size: 0.82rem;
                line-height: 1.75;
            }
        }

        @media (max-width: 420px) {
            .cover-flex .card {
                flex: 0 0 130px;
                width: 130px;
            }
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="texture-overlay"></div>

    <!-- ==================== 首页 ==================== -->
    <div id="coverPage" class="page active">
        <div class="header">
            <h1>🗺️ 地图小抄</h1>
            <div class="header-credits" id="mainCredits">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>
        <div class="cover-flex" id="coverGrid"></div>
        <div class="footer-credits" id="mainFooter">更新日期：2026/11/9</div>
    </div>

    <!-- ==================== 难度选择 ==================== -->
    <div id="difficultyPage" class="page">
        <button class="back-btn" onclick="goHome()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>
        <div class="detail-header">
            <h2 id="difficultyMapTitle"></h2>
            <div class="subtitle" id="difficultySubtitle"></div>
        </div>
        <div class="grid-4" id="difficultyGrid"></div>
    </div>

    <!-- ==================== 第一层内容（文件夹 / 大分类） ==================== -->
    <div id="level1Page" class="page">
        <button class="back-btn" onclick="goBackToDifficulty()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>
        <div class="detail-header">
            <h2 id="level1Title"></h2>
            <div class="subtitle" id="level1Subtitle"></div>
            <div class="breadcrumb" id="level1Breadcrumb"></div>
            <!-- 右上角署名容器 -->
            <div class="header-credits" id="level1HeaderCredits"></div>
        </div>
        <div class="grid-4" id="level1Grid"></div>
        <!-- 底部保留，但不再放置署名 -->
        <div class="footer-credits" id="level1Credits"></div>
    </div>

    <!-- ==================== 第二层内容（子分类，仅 nested 使用） ==================== -->
    <div id="level2Page" class="page">
        <button class="back-btn" onclick="goBackToLevel1()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>
        <div class="detail-header">
            <h2 id="level2Title"></h2>
            <div class="subtitle" id="level2Subtitle"></div>
            <div class="breadcrumb" id="level2Breadcrumb"></div>
            <div class="header-credits" id="level2HeaderCredits"></div>
        </div>
        <div class="grid-4" id="level2Grid"></div>
        <div class="footer-credits" id="level2Credits"></div>
    </div>

    <!-- ==================== 第三层内容（地图列表） ==================== -->
    <div id="level3Page" class="page">
        <button class="back-btn" onclick="goBackToLevel2OrLevel1()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>
        <div class="detail-header">
            <h2 id="level3Title"></h2>
            <div class="subtitle" id="level3Subtitle"></div>
            <div class="breadcrumb" id="level3Breadcrumb"></div>
            <div class="header-credits" id="level3HeaderCredits"></div>
        </div>
        <div class="grid-auto" id="level3Grid"></div>
        <div class="footer-credits" id="level3Credits"></div>
    </div>

    <!-- ==================== 查看器 ==================== -->
    <div id="viewer" class="viewer">
        <button class="back-btn viewer-back" onclick="closeViewer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>
        <button class="close-btn" onclick="closeViewer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12" />
            </svg>
        </button>
        <button class="nav-btn left" id="viewerPrev" onclick="navigateViewer(-1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>
        <button class="nav-btn right" id="viewerNext" onclick="navigateViewer(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6" />
            </svg>
        </button>
        <img id="viewerImage" src="" alt="地图" />
        <div class="page-indicator" id="viewerIndicator">1 / 1</div>
    </div>

    <!-- ==================== 教程提示弹窗 ==================== -->
    <div id="tipModal" class="tip-modal">
        <div class="tip-box">
            <button class="tip-close" onclick="closeTip()" aria-label="关闭">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12" />
                </svg>
            </button>
            <h3 id="tipTitle"></h3>
            <div id="tipBody"></div>
            <button class="tip-ok" onclick="closeTip()">知道了</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  数据层 — 可扩展：在此添加新地图、新难度
        // ================================================================

        // 每个地图 × 每个难度的署名（分页面右上角使用）
        const CREDITS = {
            '厄运之女': {
                '普通': {
                    map: '@展十（超自然行动组）',
                    cover: '小红书@風.',
                    web: '封面优化+网页：@灵星连'
                },
                '困难': {
                    map: '@展十（超自然行动组）',
                    cover: '小红书@風.',
                    web: '封面优化+网页：@灵星连'
                },
                '噩梦（一楼正门进）': {
                    map: '@展十（超自然行动组）',
                    cover: '@岚鹿梦',
                    web: '网页：@岚鹿梦'
                },
                '噩梦（二楼侧门进）': {
                    map: '@展十（超自然行动组）',
                    cover: '桃桃桃不掉@🐱',
                    web: '网页：@岚鹿梦'
                }
            },
            '磷光症': {
                '普通': {
                    map: '@展十（超自然行动组）',
                    cover: '@岚鹿梦',
                    web: '@岚鹿梦'
                },
                '困难': {
                    map: '@展十（超自然行动组）',
                    cover: '@岚鹿梦',
                    web: '@岚鹿梦'
                },
                '噩梦': {
                    map: '@展十（超自然行动组）',
                    cover: '@岚鹿梦',
                    web: '@岚鹿梦'
                }
            }
        };

        function getCredits(mapKey, diffKey) {

        // ================================================================
        //  工具函数
        // ================================================================
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function getDifficultyData(mapKey, diffKey) {
            const map = APP_DATA[mapKey];
            if (!map) return null;
            return map.difficulties[diffKey] || null;
        }

        function getMapDisplayName(mapKey) {
            return APP_DATA[mapKey]?.displayName || mapKey;
        }

        function getDiffDisplayName(mapKey, diffKey) {
            const d = getDifficultyData(mapKey, diffKey);
            return d?.displayName || diffKey;
        }

        function buildImagePath(mapKey, diffKey, ...segments) {
            return `images/${mapKey}/${diffKey}/${segments.join('/')}`;
        }

        // ================================================================
        //  教程提示弹窗
        // ================================================================
        let pendingMapKey = null;

        // 打开地图的统一入口：有教程就先弹提示，没有就直接进难度选择
        function openMapWithTip(mapKey) {
            const tip = MAP_TIPS[mapKey];
            if (tip) {
                showTip(mapKey, tip);
            } else {
                openDifficultyPage(mapKey);
            }
        }

        function showTip(mapKey, tip) {
            pendingMapKey = mapKey;
            document.getElementById('tipTitle').textContent = tip.title;
            document.getElementById('tipBody').innerHTML = tip.steps.map((s, i) => `
                <div class="tip-step">
                    <span class="num">${i + 1}</span>
                    <span>${s}</span>
                </div>
            `).join('');
            document.getElementById('tipModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeTip() {
            const modal = document.getElementById('tipModal');
            if (!modal.classList.contains('active')) return;
            modal.classList.remove('active');
            document.body.style.overflow = '';
            const key = pendingMapKey;
            pendingMapKey = null;
            if (key) openDifficultyPage(key);
        }

        // ================================================================
        //  首页
        // ================================================================
        function buildCoverPage() {
            const c = MAIN_CREDITS;
            document.getElementById('mainCredits').innerHTML = `
                <span class="credit-line">地图：${c.map}</span>
                <span class="credit-line">封面：${c.cover}</span>
                <span class="credit-line">网页：${c.web}</span>
            `;

            const grid = document.getElementById('coverGrid');
            grid.innerHTML = '';
            for (const [key, mapData] of Object.entries(APP_DATA)) {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openMapWithTip(key);

                const imgPath = `images/${key}/封面.jpg`;
                const diffCount = Object.keys(mapData.difficulties).length;

                card.innerHTML = `
                    <div class="card-image-wrap">
                        <img src="${imgPath}" alt="${mapData.displayName}" onerror="this.style.display='none'">
                    </div>
                    <div class="card-label">
                        ${mapData.displayName}
                        <span class="badge">(${diffCount}难度)</span>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        // ================================================================
        //  难度选择页
        // ================================================================
        function openDifficultyPage(mapKey) {
            state.currentMapKey = mapKey;
            const mapData = APP_DATA[mapKey];
            if (!mapData) return;

            document.getElementById('difficultyMapTitle').textContent = mapData.displayName;
            document.getElementById('difficultySubtitle').textContent = `共 ${Object.keys(mapData.difficulties).length} 种难度`;

            const grid = document.getElementById('difficultyGrid');
            grid.innerHTML = '';

            for (const [diffKey, diffData] of Object.entries(mapData.difficulties)) {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => enterDifficulty(mapKey, diffKey);

                const imgPath = buildImagePath(mapKey, diffKey, '封面.jpg');
                const mapCount = diffData.type === 'simple' ?
                    diffData.folders.reduce((acc, f) => acc + f.maps.length, 0) :
                    diffData.categories.reduce((acc, c) => acc + c.subcategories.reduce((s, sc) => s + sc.maps.length, 0),
                    0);

                card.innerHTML = `
                    <div class="card-image-wrap">
                        <img src="${imgPath}" alt="${diffData.displayName}" onerror="this.style.display='none'">
                    </div>
                    <div class="card-label">
                        ${diffData.displayName}
                        <span class="badge">(${mapCount}张)</span>
                    </div>
                `;
                grid.appendChild(card);
            }

            showPage('difficultyPage');
        }

        function goHome() {
            if (document.getElementById('viewer').classList.contains('active')) closeViewer();
            showPage('coverPage');
        }

        function goBackToDifficulty() {
            if (document.getElementById('viewer').classList.contains('active')) closeViewer();
            openDifficultyPage(state.currentMapKey);
        }

        // ================================================================
        //  进入难度（渲染第一层）
        // ================================================================
        function enterDifficulty(mapKey, diffKey) {
            state.currentDifficultyKey = diffKey;
            const diffData = getDifficultyData(mapKey, diffKey);
            if (!diffData) return;

            if (diffData.type === 'simple') {
                renderLevel1Simple(mapKey, diffKey, diffData);
            } else if (diffData.type === 'nested') {
                renderLevel1Nested(mapKey, diffKey, diffData);
            }
        }

        // ----- simple: 渲染文件夹列表 -----
        function renderLevel1Simple(mapKey, diffKey, diffData) {
            state.currentFolderIndex = -1;
            state.currentCategoryIndex = -1;
            state.currentSubIndex = -1;

            document.getElementById('level1Title').textContent = getDiffDisplayName(mapKey, diffKey);
            document.getElementById('level1Subtitle').textContent = `共 ${diffData.folders.length} 个分类`;
            document.getElementById('level1Breadcrumb').innerHTML =
                `<span>${getMapDisplayName(mapKey)}</span> ／ ${getDiffDisplayName(mapKey, diffKey)}`;

            // 右上角署名
            const creds = getCredits(mapKey, diffKey);
            document.getElementById('level1HeaderCredits').innerHTML = `
                <span class="credit-line">地图：${creds.map || ''}</span>
                <span class="credit-line">封面：${creds.cover || ''}</span>
                <span class="credit-line">${creds.web || ''}</span>
            `;
            // 清空底部署名
            document.getElementById('level1Credits').innerHTML = '';

            const grid = document.getElementById('level1Grid');
            grid.innerHTML = '';

            diffData.folders.forEach((folder, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openFolderMapList(mapKey, diffKey, idx);

                const imgPath = buildImagePath(mapKey, diffKey, folder.name, '封面.jpg');
                const count = folder.maps.length;

                card.innerHTML = `
                    <div class="card-image-wrap">
                        <img src="${imgPath}" alt="${folder.name}" onerror="this.style.display='none'">
                    </div>
                    <div class="card-label">
                        ${folder.name}
                        <span class="badge">(${count}张)</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            showPage('level1Page');
        }

        // ----- nested: 渲染大分类列表 -----
        function renderLevel1Nested(mapKey, diffKey, diffData) {
            state.currentFolderIndex = -1;
            state.currentCategoryIndex = -1;

            document.getElementById('level1Title').textContent = getDiffDisplayName(mapKey, diffKey);

                <span class="credit-line">地图：${creds.map || ''}</span>
                <span class="credit-line">封面：${creds.cover || ''}</span>
                <span class="credit-line">${creds.web || ''}</span>
            `;
            document.getElementById('level2Credits').innerHTML = '';

            const grid = document.getElementById('level2Grid');
            grid.innerHTML = '';

            cat.subcategories.forEach((sub, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openSubMapList(mapKey, diffKey, catIdx, idx);

                const imgPath = buildImagePath(mapKey, diffKey, cat.name, sub.name, '封面.jpg');
                const count = sub.maps.length;

                card.innerHTML = `
                    <div class="card-image-wrap">
                        <img src="${imgPath}" alt="${sub.name}" onerror="this.style.display='none'">
                    </div>
                    <div class="card-label">
                        ${sub.name}
                        <span class="badge">(${count}张)</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            showPage('level2Page');
        }

        function goBackToLevel1() {
            if (document.getElementById('viewer').classList.contains('active')) closeViewer();
            const mapKey = state.currentMapKey;
            const diffKey = state.currentDifficultyKey;
            const diffData = getDifficultyData(mapKey, diffKey);
            if (!diffData) { showPage('coverPage'); return; }
            if (diffData.type === 'simple') {
                renderLevel1Simple(mapKey, diffKey, diffData);
            } else {
                renderLevel1Nested(mapKey, diffKey, diffData);
            }
        }

        // ================================================================
        //  第三层：地图列表（并处理单张直接查看）
        // ================================================================

        // ----- simple: 打开文件夹的地图列表 -----
        function openFolderMapList(mapKey, diffKey, folderIdx) {
            const diffData = getDifficultyData(mapKey, diffKey);
            if (!diffData || diffData.type !== 'simple') return;
            const folder = diffData.folders[folderIdx];
            if (!folder) return;

            // 若只有一张地图，直接打开查看器
            if (folder.maps.length === 1) {
                state.currentFolderIndex = -1;
                openViewerSimple(mapKey, diffKey, folder.name, folder.maps, folder.labels || [], 0);
                return;
            }

            state.currentFolderIndex = folderIdx;
            renderMapList(
                mapKey, diffKey,
                folder.name,
                folder.maps,
                folder.labels || [],
                'simple',
                null, null
            );
        }

        // ----- nested: 打开子分类的地图列表 -----
        function openSubMapList(mapKey, diffKey, catIdx, subIdx) {
            const diffData = getDifficultyData(mapKey, diffKey);
            if (!diffData || diffData.type !== 'nested') return;
            const cat = diffData.categories[catIdx];
            if (!cat) return;
            const sub = cat.subcategories[subIdx];
            if (!sub) return;

            // 若只有一张地图，直接打开查看器
            if (sub.maps.length === 1) {
                state.currentCategoryIndex = catIdx;
                state.currentSubIndex = -1;
                openViewerNested(mapKey, diffKey, cat.name, sub.name, sub.maps, sub.labels || [], 0);
                return;
            }

            state.currentCategoryIndex = catIdx;
            state.currentSubIndex = subIdx;
            renderMapList(
                mapKey, diffKey,
                sub.name,
                sub.maps,
                sub.labels || [],
                'nested',
                cat.name,
                sub.name
            );
        }

        // ----- 通用地图列表渲染 -----
        function renderMapList(mapKey, diffKey, title, maps, labels, type, categoryName, subName) {
            document.getElementById('level3Title').textContent = title;
            document.getElementById('level3Subtitle').textContent = `共 ${maps.length} 张地图`;

            let breadcrumb = `<span>${getMapDisplayName(mapKey)}</span> ／ <span>${getDiffDisplayName(mapKey, diffKey)}</span>`;
            if (type === 'nested' && categoryName) {
                breadcrumb += ` ／ <span>${categoryName}</span> ／ ${subName || title}`;
            } else if (type === 'simple') {
                breadcrumb += ` ／ ${title}`;
            }
            document.getElementById('level3Breadcrumb').innerHTML = breadcrumb;

            const creds = getCredits(mapKey, diffKey);
            document.getElementById('level3HeaderCredits').innerHTML = `
                <span class="credit-line">地图：${creds.map || ''}</span>
                <span class="credit-line">封面：${creds.cover || ''}</span>
                <span class="credit-line">${creds.web || ''}</span>
            `;
            document.getElementById('level3Credits').innerHTML = '';

            const grid = document.getElementById('level3Grid');
            grid.innerHTML = '';

            const isNested = (type === 'nested');

            maps.forEach((map, idx) => {
                const card = document.createElement('div');
                card.className = 'map-card';
                card.onclick = () => {
                    if (isNested && categoryName && subName) {
                        openViewerNested(mapKey, diffKey, categoryName, subName, maps, labels || [], idx);
                    } else {
                        openViewerSimple(mapKey, diffKey, title, maps, labels || [], idx);
                    }
                };

                let mapPath;
                if (isNested && categoryName && subName) {
                    mapPath = buildImagePath(mapKey, diffKey, categoryName, subName, map);
                } else {
                    mapPath = buildImagePath(mapKey, diffKey, title, map);
                }

                const label = (labels && labels[idx]) ? labels[idx] : '地图 ' + (idx + 1);

                card.innerHTML = `
                    <div class="map-image-wrap">
                        <img src="${mapPath}" alt="${label}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 60%22%3E%3Crect fill=%22%232a2a2a%22 width=%22100%22 height=%2260%22/%3E%3Ctext x=%2250%22 y=%2235%22 text-anchor=%22middle%22 fill=%22%239a9590%22 font-size=%2212%22%3E图片加载失败%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="map-label">
                        <span>${label}</span>
                        <span class="expand-icon">⊕</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            showPage('level3Page');
        }

        function goBackToLevel2OrLevel1() {
            if (document.getElementById('viewer').classList.contains('active')) closeViewer();
            const mapKey = state.currentMapKey;
            const diffKey = state.currentDifficultyKey;
            const diffData = getDifficultyData(mapKey, diffKey);
            if (!diffData) { showPage('coverPage'); return; }

            if (diffData.type === 'simple') {
                renderLevel1Simple(mapKey, diffKey, diffData);
            } else {
                if (state.currentCategoryIndex >= 0) {
                    openCategorySubList(mapKey, diffKey, state.currentCategoryIndex);
                } else {
                    renderLevel1Nested(mapKey, diffKey, diffData);
                }
            }
        }

        // ================================================================
        //  查看器
        // ================================================================

        function openViewerSimple(mapKey, diffKey, folderName, maps, labels, idx) {
            state.viewerMaps = maps.slice();
            state.viewerLabels = labels.length ? labels.slice() : maps.map((_, i) => '地图 ' + (i + 1));
            state.viewerIndex = Math.min(idx, maps.length - 1);
            state.viewerFromSingle = (maps.length === 1);
            state.viewerFolderName = folderName;
            state.viewerSubName = '';
            state.viewerCategoryName = '';
            state.viewerIsNested = false;
            state._viewerMapKey = mapKey;
            state._viewerDiffKey = diffKey;
            showViewer();
        }

        function openViewerNested(mapKey, diffKey, categoryName, subName, maps, labels, idx) {
            state.viewerMaps = maps.slice();
            state.viewerLabels = labels.length ? labels.slice() : maps.map((_, i) => '地图 ' + (i + 1));
            state.viewerIndex = Math.min(idx, maps.length - 1);
            state.viewerFromSingle = (maps.length === 1);
            state.viewerFolderName = subName;
            state.viewerSubName = subName;
            state.viewerCategoryName = categoryName;
            state.viewerIsNested = true;
            state._viewerMapKey = mapKey;
            state._viewerDiffKey = diffKey;
            showViewer();
        }

        function showViewer() {
            updateViewerImage();
            document.getElementById('viewer').classList.add('active');
            document.body.style.overflow = 'hidden';

            const total = state.viewerMaps.length;
            if (total <= 1 || state.viewerFromSingle) {
                document.getElementById('viewerPrev').style.display = 'none';
                document.getElementById('viewerNext').style.display = 'none';
            } else {
                document.getElementById('viewerPrev').style.display = 'flex';
                document.getElementById('viewerNext').style.display = 'flex';
            }
            updateViewerIndicator();
        }

        function updateViewerImage() {
            const { viewerMaps, viewerIndex, viewerIsNested, viewerCategoryName, viewerFolderName, viewerSubName } = state;
            if (!viewerMaps.length) return;
            const mapName = viewerMaps[viewerIndex];
            const mapKey = state._viewerMapKey;
            const diffKey = state._viewerDiffKey;

            let imgPath;
            if (viewerIsNested && viewerCategoryName && viewerSubName) {
                imgPath = buildImagePath(mapKey, diffKey, viewerCategoryName, viewerSubName, mapName);
            } else {
                imgPath = buildImagePath(mapKey, diffKey, viewerFolderName, mapName);
            }

            const img = document.getElementById('viewerImage');
            img.src = imgPath;
            img.alt = state.viewerLabels[viewerIndex] || '地图';
            updateViewerIndicator();
        }

        function updateViewerIndicator() {
            const total = state.viewerMaps.length;
            const idx = state.viewerIndex + 1;
            document.getElementById('viewerIndicator').textContent = `${idx} / ${total}`;
        }

        function navigateViewer(delta) {
            if (state.viewerFromSingle || state.viewerMaps.length <= 1) return;
            let newIdx = state.viewerIndex + delta;
            if (newIdx < 0) newIdx = state.viewerMaps.length - 1;
            if (newIdx >= state.viewerMaps.length) newIdx = 0;
            state.viewerIndex = newIdx;
            updateViewerImage();
        }

        function closeViewer() {
            document.getElementById('viewer').classList.remove('active');
            document.body.style.overflow = '';
            const mapKey = state.currentMapKey;
            const diffKey = state.currentDifficultyKey;
            const diffData = getDifficultyData(mapKey, diffKey);
            if (!diffData) { showPage('coverPage'); return; }

            if (diffData.type === 'simple') {
                if (state.currentFolderIndex >= 0) {
                    openFolderMapList(mapKey, diffKey, state.currentFolderIndex);
                } else {
                    renderLevel1Simple(mapKey, diffKey, diffData);
                }
            } else {
                if (state.currentCategoryIndex >= 0 && state.currentSubIndex >= 0) {
                    openSubMapList(mapKey, diffKey, state.currentCategoryIndex, state.currentSubIndex);
                } else if (state.currentCategoryIndex >= 0) {
                    openCategorySubList(mapKey, diffKey, state.currentCategoryIndex);
                } else {
                    renderLevel1Nested(mapKey, diffKey, diffData);
                }
            }
        }

        // ================================================================
        //  键盘事件
        // ================================================================
        document.addEventListener('keydown', (e) => {
            // 教程弹窗优先
            if (document.getElementById('tipModal').classList.contains('active')) {
                if (e.key === 'Escape' || e.key === 'Enter') {
                    closeTip();
                    e.preventDefault();
                }
                return;
            }

            const viewerActive = document.getElementById('viewer').classList.contains('active');
            if (viewerActive) {
                if (e.key === 'Escape') {
                    closeViewer();
                    e.preventDefault();
                    return;
                }
                if (!state.viewerFromSingle && state.viewerMaps.length > 1) {
                    if (e.key === 'ArrowLeft') {
                        navigateViewer(-1);
                        e.preventDefault();
                    } else if (e.key === 'ArrowRight') {
                        navigateViewer(1);
                        e.preventDefault();
                    }
                }
                return;
            }

            if (e.key === 'Escape') {
                const activePage = document.querySelector('.page.active');
                if (activePage) {
                    const id = activePage.id;
                    if (id === 'difficultyPage') {
                        goHome();
                        e.preventDefault();
                    } else if (id === 'level1Page') {
                        goBackToDifficulty();
                        e.preventDefault();
                    } else if (id === 'level2Page') {
                        goBackToLevel1();
                        e.preventDefault();
                    } else if (id === 'level3Page') {
                        goBackToLevel2OrLevel1();
                        e.preventDefault();
                    }
                }
            }
        });

        document.getElementById('viewer').addEventListener('click', (e) => {
            if (e.target.id === 'viewer') closeViewer();
        });

        // 点击弹窗遮罩关闭（同时进入地图）
        document.getElementById('tipModal').addEventListener('click', (e) => {
            if (e.target.id === 'tipModal') closeTip();
        });

        // ================================================================
        //  初始化
        // ================================================================
        buildCoverPage();

        console.log('✅ 地图小抄整合版已加载');
        console.log('📁 当前地图:', Object.keys(APP_DATA));
        console.log('💡 如需添加新地图，请编辑 APP_DATA；如需添加教程提示，请编辑 MAP_TIPS');
    </script>

</body>
</html>
